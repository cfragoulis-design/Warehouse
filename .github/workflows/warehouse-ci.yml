name: Warehouse CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: warehouse_ci_restore_verify
          POSTGRES_USER: warehouse_ci_admin
          POSTGRES_PASSWORD: warehouse-ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U warehouse_ci_admin -d warehouse_ci_restore_verify"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: "sqlite+pysqlite:///:memory:"
      SECRET_KEY: warehouse-ci-session-secret-is-at-least-32-characters
      WAREHOUSE_TEST_POSTGRES_URL: "postgresql://warehouse_ci_admin:warehouse-ci-only-password@127.0.0.1:5432/warehouse_ci_restore_verify"
      WAREHOUSE_CRITICAL_FLOW_DATABASE_URL: "postgresql+psycopg://warehouse_ci_admin:warehouse-ci-only-password@127.0.0.1:5432/warehouse_flow_test_ci"
      WAREHOUSE_CRITICAL_FLOW_CONFIRM_DATABASE: warehouse_flow_test_ci
      WAREHOUSE_CRITICAL_FLOW_PROVIDERS_DISABLED: "true"
      WAREHOUSE_CRITICAL_FLOW_RUNTIME_DATABASE_URL: "postgresql+psycopg://warehouse_ci_runtime:warehouse-ci-runtime-only-password@127.0.0.1:5432/warehouse_flow_test_ci"
      WAREHOUSE_CRITICAL_FLOW_CONFIRM_RUNTIME_ROLE: warehouse_ci_runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Prepare disposable PostgreSQL critical-flow database
        env:
          PGPASSWORD: warehouse-ci-only-password
        run: |
          psql \
            --host 127.0.0.1 \
            --username warehouse_ci_admin \
            --dbname postgres \
            --set ON_ERROR_STOP=1 \
            --command "CREATE ROLE warehouse_ci_runtime LOGIN PASSWORD 'warehouse-ci-runtime-only-password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS"
          createdb \
            --host 127.0.0.1 \
            --username warehouse_ci_admin \
            warehouse_flow_test_ci
      - name: Compile
        run: python -m compileall -q app scripts tests
      - name: Lint correctness
        run: python -m ruff check app scripts tests
      - name: Test PostgreSQL critical flows
        run: python -m pytest -q tests/test_postgres_warehouse_integration.py
      - name: Test
        env:
          WAREHOUSE_CRITICAL_FLOW_DATABASE_URL: ""
          WAREHOUSE_CRITICAL_FLOW_RUNTIME_DATABASE_URL: ""
        run: python -m pytest -q
