{% extends "base.html" %}
{% block content %}
<h1>Χρήστες</h1>

<div class="grid2">
  <div class="card">
    <h2>Προσθήκη χρήστη</h2>
    <form method="post" action="/users/add" class="form">
      <label>Όνομα</label>
      <input name="name" required placeholder="π.χ. Staff1">
      <label>Ρόλος</label>
      <select name="role" required>
        <option value="staff">staff</option>
        <option value="admin">admin</option>
      </select>
      <label>PIN (6 ψηφία)</label>
      <input name="pin" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" minlength="6" required>
      <button type="submit">Προσθήκη</button>
    </form>
  </div>

  <div class="card">
    <h2>Λίστα</h2>
    <table>
      <thead>
        <tr>
          <th>Όνομα</th>
          <th>Ρόλος</th>
          <th>Κατάσταση</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        {% for u in users %}
          <tr>
            <td>{{ u.name }}</td>
            <td class="mono">{{ u.role }}</td>
            <td>
              {% if u.is_active %}
                <span class="pill ok">active</span>
              {% else %}
                <span class="pill">inactive</span>
              {% endif %}
            </td>
            <td>
              <form method="post" action="/users/toggle" style="margin:0">
                <input type="hidden" name="user_id" value="{{ u.id }}">
                <button class="btn small" type="submit">{% if u.is_active %}Deactivate{% else %}Activate{% endif %}</button>
              </form>
            </td>
          </tr>
        {% endfor %}
        {% if users|length == 0 %}
          <tr><td colspan="4" class="muted">Δεν υπάρχουν χρήστες.</td></tr>
        {% endif %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
