{% extends "base.html" %}
{% block content %}
<div class="card">
  <h1>Login (PIN)</h1>
  <form method="post" action="/login" class="form">
    <label>PIN (6 ψηφία)</label>
    <input name="pin" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" minlength="6" required autofocus>
    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}
    <button type="submit">Είσοδος</button>
  </form>
</div>
{% endblock %}
