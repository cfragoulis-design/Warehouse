<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Edit consumable</title>

  <link rel="stylesheet" href="/static/datetime.css" />
  <script src="/static/js/datetime.js" defer></script>

  <style>
    :root{--bg:#0b1020;--panel:#111936;--panel2:#0f162d;--line:#243055;--text:#e7e9ee;--muted:#a7b0c7;--blue:#2f7cf6;--red:#ef4444;}
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--text);}
    a{color:inherit;text-decoration:none}
    .top{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#0b1020,#0a1024);}
    .nav{display:flex;gap:10px;flex-wrap:wrap}
    .pill{padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.03)}
    .wrap{max-width:1100px;margin:18px auto;padding:0 18px}
    .card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:14px;overflow:hidden}
    .card-h{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
    .card-h h2{margin:0;font-size:16px}
    .sub{color:var(--muted);font-size:12px;margin-top:4px}
    .card-b{padding:16px}
    label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px}
    input,select,textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.15);color:var(--text);outline:none}
    textarea{min-height:90px;resize:vertical}
    .grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr 1fr 1fr;gap:12px;align-items:end}
    .grid2{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-top:12px}
    .btn{background:var(--blue);border:none;color:white;padding:10px 14px;border-radius:10px;cursor:pointer;font-weight:700}
    .btn2{background:transparent;border:1px solid var(--line);color:var(--text);padding:10px 14px;border-radius:10px;cursor:pointer}
    .row{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}
    .muted{color:var(--muted)}
    @media (max-width: 980px){
      .grid{grid-template-columns:1fr 1fr}
      .grid2{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <div class="top">
    <div class="nav">
      <a class="pill" href="/dashboard">Dashboard</a>
      <a class="pill" href="/stock">Stock</a>
      <a class="pill" href="/movements">Movements</a>
      <a class="pill" href="/products">Products</a>
      <a class="pill" href="/consumables"><b>Consumables</b></a>
      <a class="pill" href="/suppliers">Suppliers</a>
      <a class="pill" href="/purchase-orders">Purchase Orders</a>
    </div>
    <div class="right">
      <span class="muted">Edit</span>
    </div>
  </div>

  <div class="wrap">
    <div class="card">
      <div class="card-h">
        <div>
          <h2>Edit consumable</h2>
          <div class="sub">Update name, supplier, pack, min/desired and cost.</div>
        </div>
        <div class="sub"><a class="btn2" href="/consumables">Back</a></div>
      </div>
      <div class="card-b">
        <form method="post" action="/consumables/{{ c.id }}/edit">
          <div class="grid">
            <div>
              <label>Name *</label>
              <input name="name" value="{{ c.name }}" required />
            </div>
            <div>
              <label>Category</label>
              <input name="category" value="{{ c.category or '' }}" />
            </div>
            <div>
              <label>Unit</label>
              <input name="unit" value="{{ c.unit or '' }}" />
            </div>
            <div>
              <label>Pack size</label>
              <input name="pack_size" type="number" step="1" min="1" value="{{ c.pack_size or 1 }}" />
            </div>
            <div>
              <label>Min</label>
              <input name="min_qty" type="number" step="1" min="0" value="{{ c.min_qty or 0 }}" />
            </div>
            <div>
              <label>Desired</label>
              <input name="desired_qty" type="number" step="1" min="0" value="{{ c.desired_qty or 0 }}" />
            </div>
            <div>
              <label>Cost €/pack</label>
              <input name="cost_per_pack" type="number" step="0.01" min="0" value="{{ c.cost_per_pack if c.cost_per_pack is defined else 0 }}" />
            </div>
          </div>

          <div class="grid2">
            <div>
              <label>Supplier</label>
              <select name="supplier_id">
                <option value="">—</option>
                {% for s in suppliers_list %}
                  <option value="{{ s.id }}" {% if c.supplier_id == s.id %}selected{% endif %}>{{ s.name }}</option>
                {% endfor %}
              </select>
            </div>
            <div>
              <label>Notes</label>
              <input name="notes" value="{{ c.notes or '' }}" />
            </div>
          </div>

          <div class="row">
            <button class="btn" type="submit">Save</button>
            <a class="btn2" href="/consumables">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
