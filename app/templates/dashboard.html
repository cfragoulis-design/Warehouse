
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sklavounos Stock</title>
  <style>
    :root{
      --bg:#0b1020; --panel:#111936; --panel2:#0e1530; --line:#243055;
      --text:#e7e9ee; --muted:#a7b0c7; --blue:#2f7cf6;
      --good:#35c27d; --warn:#caa24a; --danger:#ff6b6b;
    }
    *{box-sizing:border-box}
    body{font-family:system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text);margin:0;}
    a{color:#8ab4ff;text-decoration:none}
    .top{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;
      background:linear-gradient(180deg,#111936 0%, #0b1020 100%);border-bottom:1px solid var(--line);}
    .brand{display:flex;align-items:center;gap:10px;}
    .brand img{height:32px;}
    .brand-title{font-weight:800;letter-spacing:0.4px;}
    .muted{color:var(--muted)}
    .btn{background:var(--blue);color:white;border:0;border-radius:10px;padding:10px 12px;font-weight:600;cursor:pointer}
    .page{max-width:980px;margin:22px auto;padding:0 16px;}
    .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;}
    .actionsGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:10px;}
    .action{display:block;padding:14px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);}
    .badge{font-size:11px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);margin-right:6px;}
    .badge.good{border-color:rgba(53,194,125,0.35);color:#b8f0d4;}
    .badge.warn{border-color:rgba(202,162,74,0.35);color:#ffe4a5;}
    .badge.danger{border-color:rgba(255,107,107,0.35);color:#ffd0d0;}
  </style>
</head>
<body>

<div class="page">
  <div class="grid">

    <div class="card" style="grid-column:span 12;">
      <strong>Αναλώσιμα (WORKSHOP)</strong>
      <div class="actionsGrid">
        <a class="action" href="/consumables">
          {% if consumables_stats is defined %}
            <span class="badge danger">Low: {{ consumables_stats.low }}</span>
            <span class="badge warn">Suggested: {{ consumables_stats.suggested }}</span>
          {% else %}
            <span class="muted">View consumables</span>
          {% endif %}
        </a>

        <a class="action" href="/purchase-orders">
          <strong>Παραγγελίες Αναλωσίμων</strong>
          <span class="muted">Draft / Pending / Received</span>
        </a>
      </div>
    </div>

  </div>
</div>

</body>
</html>
