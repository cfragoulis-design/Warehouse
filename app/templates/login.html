<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sklavounos Stock</title>
  <style>
    bbody{
  background: radial-gradient(circle at top, #0e1430 0%, #05070f 70%);
}

    .wrap{
  max-width:420px;
  margin:8vh auto;
  padding:24px;
  background:#070b16;        /* ΠΙΟ ΜΑΥΡΟ */
  border:1px solid #1f2a44;  /* ΠΙΟ ΔΙΑΚΡΙΤΙΚΟ */
  border-radius:14px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.6);
}

    .logo{display:flex;justify-content:center;margin-bottom:16px;}
    .logo img{width:170px;}
    h1{margin:0 0 14px;font-size:20px;text-align:center;}
    label{display:block;margin-top:12px;font-size:13px;color:#b7c0d9}
    input{width:100%;padding:10px 12px;margin-top:6px;border-radius:10px;border:1px solid #2b3a67;background:#0e1530;color:#e7e9ee;}
    button{margin-top:16px;width:100%;padding:10px 12px;border-radius:10px;border:0;background:#4b7bec;color:white;font-weight:600;cursor:pointer;}
    .err{margin-top:12px;padding:10px;border-radius:10px;background:#2a1420;border:1px solid #6a2840;color:#ffb3c1;font-size:13px;}
    .hint{margin-top:12px;color:#9aa5c5;font-size:12px;line-height:1.4}
    code{background:#0e1530;padding:2px 6px;border-radius:6px;border:1px solid #2b3a67}
  </style>
</head>
<body>
  <div class="wrap">

    <div class="logo">
      <img src="/static/logo-full.png" alt="Sklavounos">
    </div>

    <h1>Login</h1>

    {% if err %}
      <div class="err">Wrong username or PIN.</div>
    {% endif %}

    <form method="post" action="/login">
      <label>Username</label>
      <input name="username" autocomplete="username" required />

      <label>PIN</label>
      <input name="pin" type="password" inputmode="numeric" autocomplete="current-password" required />

      <button type="submit">Sign in</button>
    </form>

    <div class="hint">
      Initial admins are seeded if the users table is empty using env vars:
      <br><code>INITIAL_ADMIN_PIN</code> and <code>INITIAL_ADMIN2_PIN</code>.
    </div>
  </div>
</body>
</html>
