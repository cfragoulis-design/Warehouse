<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Σύνδεση · Sklavounos Warehouse</title>
<style>
  :root{
    --bg1:#0e1430;
    --bg2:#05070f;
    --panel1:#070b16;
    --panel2:#060914;
    --line:rgba(255,255,255,0.08);
    --text:#e7e9ee;
    --muted:#b7c0d9;
    --input:#0e1530;
    --inputLine:#2b3a67;
    --btn:#4b7bec;
  }

  *{box-sizing:border-box}

  body{
    font-family:system-ui,Segoe UI,Arial,sans-serif;
    margin:0;
    color:var(--text);
    background: radial-gradient(circle at top, var(--bg1) 0%, var(--bg2) 70%);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }

  .wrap{
    width:100%;
    max-width:420px;
    padding:26px;
    background: linear-gradient(180deg, var(--panel1) 0%, var(--panel2) 100%);
    border:1px solid var(--line);
    border-radius:16px;
    box-shadow: 0 18px 45px rgba(0,0,0,0.55);
  }

  .logo{display:flex;justify-content:center;margin-bottom:14px;}
  .logo img{width:160px;max-width:100%;height:auto;}

  h1{
    margin:0 0 14px;
    font-size:20px;
    text-align:center;
    color:var(--text);
  }

  label{
    display:block;
    margin-top:12px;
    font-size:13px;
    color:var(--muted);
  }

  input{
    width:100%;
    padding:10px 12px;
    margin-top:6px;
    border-radius:10px;
    border:1px solid var(--inputLine);
    background:var(--input);
    color:var(--text);
    outline:none;
  }

  input:focus{
    border-color:rgba(75,123,236,0.75);
    box-shadow:0 0 0 3px rgba(75,123,236,0.15);
  }

  button{
    margin-top:16px;
    width:100%;
    padding:10px 12px;
    border-radius:10px;
    border:0;
    background:var(--btn);
    color:white;
    font-weight:600;
    cursor:pointer;
  }

  .err{
    margin-top:12px;
    padding:10px;
    border-radius:10px;
    background:#2a1420;
    border:1px solid #6a2840;
    color:#ffb3c1;
    font-size:13px;
  }

  .hint{
    margin-top:12px;
    color:#9aa5c5;
    font-size:12px;
    line-height:1.4;
  }

  code{
    background:var(--input);
    padding:2px 6px;
    border-radius:6px;
    border:1px solid var(--inputLine);
  }
</style>

  <link rel="stylesheet" href="/static/sr-theme.css" />
</head>
<body>
  <div class="wrap">

    <div class="logo">
      <img src="/static/brand/cf-logo-stacked-dark.svg" alt="Christos Fragoulis Digital Solutions" width="220" height="220">
    </div>

    <h1>Σύνδεση στο Warehouse</h1>

    {% if err == 'rate' %}
      <div class="err">Πολλές αποτυχημένες προσπάθειες. Περιμένετε λίγα λεπτά και δοκιμάστε ξανά.</div>
    {% elif err %}
      <div class="err">Λάθος όνομα χρήστη ή PIN.</div>
    {% endif %}

    <form method="post" action="/login">
      <label>Όνομα χρήστη</label>
      <input name="username" autocomplete="username" required />

      <label>PIN</label>
      <input name="pin" type="password" inputmode="numeric" autocomplete="current-password" required />

      <button type="submit">Σύνδεση</button>
    </form>

    <div class="hint">
      Η πρόσβαση επιτρέπεται μόνο σε εξουσιοδοτημένους χρήστες της επιχείρησης.
    </div>
  </div>
</body>
</html>
