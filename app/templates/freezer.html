{% extends "base.html" %}
{% block content %}
<div class="container" style="max-width: 1050px; margin: 28px auto;">
  <div style="display:flex; align-items:center; justify-content:space-between; gap:16px;">
    <div>
      <h1 style="margin:0;">Freezer</h1>
      <div class="muted" style="margin-top:6px;">Products marked as <b>Only in Freezer</b>.</div>
    </div>
    <form method="get" action="/freezer" style="display:flex; gap:10px; align-items:center;">
      <input type="text" name="q" value="{{ q }}" placeholder="Search name or SKU" class="input" style="min-width:260px;">
      <button class="btn">Search</button>
    </form>
  </div>

  <div class="card" style="margin-top:16px;">
    <div class="card-header" style="display:flex; justify-content:space-between; align-items:center;">
      <div style="font-weight:800;">Freezer Items</div>
    </div>
    <div class="card-body" style="padding:0;">
      <table class="table" style="width:100%;">
        <thead>
          <tr>
            <th style="text-align:left; padding:12px 14px;">Product</th>
            <th style="text-align:left; padding:12px 14px;">SKU</th>
            <th style="text-align:left; padding:12px 14px;">Unit</th>
          </tr>
        </thead>
        <tbody>
          {% if not items %}
            <tr><td colspan="3" style="padding:14px;" class="muted">No items found.</td></tr>
          {% else %}
            {% for p in items %}
              <tr>
                <td style="padding:12px 14px; font-weight:700;">{{ p.name }}</td>
                <td style="padding:12px 14px;">{{ p.sku or "" }}</td>
                <td style="padding:12px 14px;">{{ p.unit or "" }}</td>
              </tr>
            {% endfor %}
          {% endif %}
        </tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}
