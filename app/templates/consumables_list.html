
<!-- PATCH 1: Supplier Dropdown -->
<form method="post" action="/consumables/new">
  <input name="name" placeholder="Όνομα αναλώσιμου" required>
  <input name="category" placeholder="Κατηγορία">
  <input name="unit" placeholder="Μονάδα (πχ Τεμ)">
  <input name="pack_size" type="number" placeholder="Pack">
  <input name="min_qty" type="number" placeholder="Min">
  <input name="desired_qty" type="number" placeholder="Desired">

  <select name="supplier_id" required>
    {% for s in suppliers %}
      <option value="{{ s.id }}">{{ s.name }}</option>
    {% endfor %}
  </select>

  <button type="submit">Προσθήκη</button>
</form>
