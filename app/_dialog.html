<!-- Global Dialog Modal (opens when URL contains ?msg=...&level=...) -->
<div id="dlgOverlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:99999;">
  <div style="max-width:520px; margin:10vh auto; background:#0f1733; border:1px solid rgba(255,255,255,.10); border-radius:14px; padding:18px; box-shadow:0 20px 60px rgba(0,0,0,.45); color:#e7e9ee;">
    <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:12px;">
      <div>
        <div id="dlgTitle" style="font-weight:800; font-size:16px; margin-bottom:6px;">Info</div>
        <div id="dlgText" style="font-size:14px; line-height:1.45; color:#cfd6ea;"></div>
      </div>
      <button id="dlgClose" type="button" aria-label="Close"
        style="border:0; background:transparent; color:#e7e9ee; font-size:20px; line-height:1; cursor:pointer;">×</button>
    </div>
    <div style="margin-top:14px; text-align:right;">
      <button id="dlgOk" type="button"
        style="padding:8px 14px; border-radius:12px; border:1px solid rgba(255,255,255,.14); background:rgba(255,255,255,.06); color:#e7e9ee; cursor:pointer;">
        OK
      </button>
    </div>
  </div>
</div>

<script>
(function () {
  try {
    var url = new URL(window.location.href);
    var msg = url.searchParams.get("msg");
    if (!msg) return;

    var level = (url.searchParams.get("level") || "info").toLowerCase();
    var title = (level === "error") ? "Error" : (level === "warning" ? "Warning" : "Info");

    var overlay = document.getElementById("dlgOverlay");
    var titleEl = document.getElementById("dlgTitle");
    var textEl = document.getElementById("dlgText");

    titleEl.textContent = title;
    textEl.textContent = msg;

    function closeDlg() {
      overlay.style.display = "none";
      url.searchParams.delete("msg");
      url.searchParams.delete("level");
      window.history.replaceState({}, "", url.toString());
    }

    document.getElementById("dlgClose").onclick = closeDlg;
    document.getElementById("dlgOk").onclick = closeDlg;
    overlay.onclick = function(e){ if (e.target === overlay) closeDlg(); };

    overlay.style.display = "block";
  } catch(e) {}
})();
</script>
